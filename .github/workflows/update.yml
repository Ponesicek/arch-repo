name: Update packages

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: pacman-repo
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git github-cli jq pacman-contrib

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create build user
        run: |
          useradd --create-home builder
          chown -R builder: "$GITHUB_WORKSPACE"

      - name: Update, build and publish
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: runuser -u builder -- scripts/ci.sh

      # GitHub disables scheduled workflows after 60 days without repository
      # activity. Re-enabling it on every scheduled run keeps it alive.
      - name: Keep the schedule enabled
        if: always() && github.event_name == 'schedule'
        run: gh api --method PUT "repos/$GH_REPO/actions/workflows/update.yml/enable"
